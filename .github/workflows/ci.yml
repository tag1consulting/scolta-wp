name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Composer resolves the tag1consulting/scolta-php VCS repo and every packagist
# dist through api.github.com. Unauthenticated that is 60 req/hour/IP, and when
# it runs dry composer cannot prompt under no-interaction and dies with
# "Could not authenticate against github.com" (AuthHelper.php:152, exit 100).
# The run's own token raises it to 1,000 req/hour/repo. Read-only is enough:
# scolta-php is public, so GITHUB_TOKEN can read it even though the token is
# scoped to this repository.
env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - php: '8.2'
            lint: false
          - php: '8.3'
            lint: true
          - php: '8.4'
            lint: false
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: intl
          coverage: none

      - name: Replace path repo with GitHub VCS repo
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [["type" => "vcs", "url" => "https://github.com/tag1consulting/scolta-php.git"]];
            $j["require"]["tag1/scolta-php"] = "dev-main@dev";
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --ignore-platform-req=php

      - name: Lint (WordPress coding standards)
        if: matrix.lint
        run: composer lint

      - name: Run tests
        run: composer test

  # The committed browser assets are duplicated from scolta-php on purpose: the
  # plugin zip must contain them, and Composer does not run a dependency's
  # scripts, so nothing copies anything when a site installs the plugin. The
  # committed file IS the shipped file, and this job is the only thing standing
  # between a stale copy and a release.
  #
  # It lives in one job deliberately. It used to be a step inside `test`, after
  # a `composer update` that fired post-update-cmd -> copy-assets, so it
  # compared a file Composer had just written against the source it wrote it
  # from and could not fail on a stale committed copy. The hook is gone (see
  # CHANGELOG); this is the check that replaces it.
  assets-in-sync:
    name: assets-in-sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl
          coverage: none

      - name: Replace path repo with GitHub VCS repo
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [["type" => "vcs", "url" => "https://github.com/tag1consulting/scolta-php.git"]];
            $j["require"]["tag1/scolta-php"] = "dev-main@dev";
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --ignore-platform-req=php

      - name: Compare committed assets against the vendored canonical
        run: |
          set -euo pipefail
          CANONICAL=vendor/tag1/scolta-php/assets
          fail=0

          # Byte comparison, not checksums: it needs no manifest, it cannot be
          # subtly wrong, and it works against every scolta-php version. The
          # two layouts differ only by this plugin's assets/ prefix.
          compare() {
            src="$CANONICAL/$1"
            dest="$2"
            if [ ! -f "$src" ]; then
              echo "ERROR: canonical source $src is missing from the vendored scolta-php."
              fail=1
              return
            fi
            if [ ! -f "$dest" ]; then
              echo "ERROR: committed asset $dest is missing."
              fail=1
              return
            fi
            if cmp -s "$src" "$dest"; then
              echo "OK:       $dest is byte-identical to scolta-php assets/$1"
            else
              echo "MISMATCH: $dest differs from scolta-php assets/$1"
              fail=1
            fi
          }

          # assets/css/amazee-admin.css and assets/js/amazee-admin.js are this
          # plugin's own, not vendored, and are deliberately absent here.
          compare js/scolta.js             assets/js/scolta.js
          compare css/scolta.css           assets/css/scolta.css
          compare wasm/scolta_core.js      assets/wasm/scolta_core.js
          compare wasm/scolta_core_bg.wasm assets/wasm/scolta_core_bg.wasm

          if [ "$fail" -ne 0 ]; then
            cat >&2 <<'MSG'

          ------------------------------------------------------------------
          The committed browser assets do not match scolta-php.

          This job resolves tag1/scolta-php from dev-main, so it compares what
          this branch would ship against the current tip of scolta-php main.
          Two things cause a mismatch, and the second is the common one:

            1. A STALE COMMITTED COPY. A re-vendor was forgotten or partial.
               Fix it here: run `composer copy-assets`, then commit the result.

            2. A COORDINATED CHANGE WHOSE UPSTREAM HAS NOT MERGED YET. The
               bundle on this branch is newer than scolta-php main, because
               the matching scolta-php pull request is still open. Nothing is
               wrong with this branch. Merge scolta-php first; this job goes
               green once main carries the same bundle.

               Do NOT run `composer copy-assets` to silence this case. That
               overwrites the new bundle with the old one and is exactly the
               failure this check exists to catch.
          ------------------------------------------------------------------
          MSG
            exit 1
          fi
          echo "All committed assets are byte-identical to the vendored scolta-php."

  # Informational coverage, never a merge gate. `assets-in-sync` and the test
  # suites pin scolta-php to dev-main, which is correct — an adapter must not
  # merge ahead of its upstream — but it also means this repo's own suite never
  # exercises an unmerged upstream change before merge.
  #
  # Commit a git ref into .github/upstream-preview to run the suite against it.
  # A committed file rather than a branch-name convention: it is visible in the
  # diff, a reviewer can see exactly what combination was tested, and nothing
  # depends on two repositories happening to use the same branch name. The file
  # being absent (or naming main, where this would just repeat `test`) skips
  # the job, so a forgotten one is harmless.
  #
  # What keeps a red preview out of the merge decision is the branch's
  # required-checks list, which this job is deliberately not on. It also carried
  # a continue-on-error flag, which was redundant against that list and made the
  # job's failure invisible on the pull request instead of merely non-blocking —
  # the opposite of what an informational job is for. That flag additionally
  # tripped the cross-package guard forbidding a muted CI failure anywhere in
  # Scolta, and an exemption for one job would have blunted the guard for every
  # other. (That guard greps this file as text and does not skip comments, so do
  # not spell the flag out in prose here — it will be reported as a violation.)
  upstream-preview:
    name: upstream preview (informational)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the requested upstream ref
        id: ref
        run: |
          if [ ! -f .github/upstream-preview ]; then
            echo "No .github/upstream-preview file; nothing to preview."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REF=$(grep -vE '^\s*(#|$)' .github/upstream-preview | head -1 | tr -d '[:space:]')
          if [ -z "$REF" ] || [ "$REF" = "main" ]; then
            echo "Upstream preview ref is '${REF:-empty}'; that is what the required jobs already test."
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Previewing against scolta-php ref: $REF"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "run=true" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        if: steps.ref.outputs.run == 'true'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl
          coverage: none

      - name: Point composer at the requested scolta-php ref
        if: steps.ref.outputs.run == 'true'
        env:
          UPSTREAM_REF: ${{ steps.ref.outputs.ref }}
        run: |
          php -r '
            $ref = getenv("UPSTREAM_REF");
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [["type" => "vcs", "url" => "https://github.com/tag1consulting/scolta-php.git"]];
            $j["require"]["tag1/scolta-php"] = "dev-" . $ref . "@dev";
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Install dependencies
        if: steps.ref.outputs.run == 'true'
        run: composer update --no-interaction --prefer-dist --ignore-platform-req=php

      - name: Run tests against the previewed upstream
        if: steps.ref.outputs.run == 'true'
        run: composer test

  coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP with Xdebug
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl
          coverage: xdebug

      - name: Replace path repo with GitHub VCS repo
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [["type" => "vcs", "url" => "https://github.com/tag1consulting/scolta-php.git"]];
            $j["require"]["tag1/scolta-php"] = "dev-main@dev";
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist

      - name: Run tests with coverage
        run: ./vendor/bin/phpunit --coverage-text --colors=never 2>&1 | tail -20

  static-analysis:
    name: Static analysis (PHPStan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl
          coverage: none

      - name: Replace path repo with GitHub VCS repo
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            $j["repositories"] = [["type" => "vcs", "url" => "https://github.com/tag1consulting/scolta-php.git"]];
            $j["require"]["tag1/scolta-php"] = "dev-main@dev";
            file_put_contents("composer.json", json_encode($j, JSON_PRETTY_PRINT | JSON_UNESCAPED_SLASHES) . "\n");
          '

      - name: Install dependencies
        run: composer update --no-interaction --prefer-dist --ignore-platform-req=php

      - name: PHPStan
        run: composer analyse

  docs-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check CHANGELOG.md updated when code changes
        run: |
          CODE_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- \
            'includes/' 'admin/' 'cli/' 'scolta.php' 'composer.json' 'tests/' | head -1)
          if [ -n "$CODE_CHANGED" ]; then
            CHANGELOG_CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- CHANGELOG.md)
            if [ -z "$CHANGELOG_CHANGED" ]; then
              echo "FAIL: Code changed but CHANGELOG.md was not updated."
              echo "Please add an entry under ## [Unreleased] in CHANGELOG.md."
              exit 1
            fi
            echo "PASS: CHANGELOG.md updated alongside code changes."
          else
            echo "SKIP: No code changes detected."
          fi

  version-consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      # Hard failure, deliberately outside the `|| echo` below. A declared
      # "version" overrides the version Composer derives from the branch or
      # tag. Packagist ignores it, but the drupal.org facade honours it, which
      # is how the sibling Drupal adapter broke `composer install` on every
      # site tracking a dev branch. WordPress reads the plugin header and
      # WordPress.org reads the Stable Tag; nothing needs it in composer.json.
      - name: composer.json must not declare a version
        run: |
          php -r '
            $j = json_decode(file_get_contents("composer.json"), true);
            if (array_key_exists("version", $j)) {
              fwrite(STDERR, "FAIL: composer.json declares \"version\": " . $j["version"] . "\n");
              fwrite(STDERR, "Remove it. The plugin header in scolta.php is the source of the\n");
              fwrite(STDERR, "plugin version; extra.branch-alias describes the dev-main mapping.\n");
              exit(1);
            }
            echo "PASS: composer.json declares no version key.\n";
          '

      # Release readiness. Advisory on a development branch, where the version
      # legitimately ends in -dev; the assertion that must never be waved
      # through is the separate step above.
      - name: Check WordPress version locations match
        run: |
          php scripts/validate-release.php || echo "Note: -dev versions expected in development"

  version-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Check version alignment with scolta-php
        run: |
          # The plugin header, not composer.json: this plugin declares no
          # "version" in composer.json (Composer derives it from the branch or
          # tag), and the header is what WordPress itself reads.
          MY_VERSION=$(grep -m1 -E '^[[:space:]]*\*[[:space:]]*Version:' scolta.php | sed -E 's/.*Version:[[:space:]]*//' | tr -d '[:space:]')
          if [ -z "$MY_VERSION" ]; then
            echo "FAIL: no Version header found in scolta.php"
            exit 1
          fi
          MY_MAJOR=$(echo "$MY_VERSION" | cut -d. -f1)
          PHP_CONSTRAINT=$(php -r "echo json_decode(file_get_contents('composer.json'))->require->{'tag1/scolta-php'};")

          echo "My version: $MY_VERSION (major: $MY_MAJOR)"
          echo "scolta-php constraint: $PHP_CONSTRAINT"

          if [ "$PHP_CONSTRAINT" = "@dev" ]; then
            echo "SKIP: Development mode (@dev constraint)"
            exit 0
          fi

          PHP_MAJOR=$(echo "$PHP_CONSTRAINT" | sed 's/[\^~>=<]//g' | cut -d. -f1)
          if [ "$MY_MAJOR" != "$PHP_MAJOR" ]; then
            echo "FAIL: Major version mismatch"
            exit 1
          fi
          echo "PASS: Major versions aligned"

  lock-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check scolta-php is stable and from Packagist
        run: |
          python3 - <<'PY'
          import json,sys,re
          lock=json.load(open("composer.lock"))
          pkgs=lock.get("packages",[])+lock.get("packages-dev",[])
          p=next((x for x in pkgs if x["name"]=="tag1/scolta-php"),None)
          if not p: sys.exit("scolta-php not in lock")
          dist=(p.get("dist") or {}).get("type")
          ver=p.get("version","")
          bad=[]
          if dist=="path": bad.append(f"dist.type=path ({(p.get('dist') or {}).get('url')})")
          if not re.fullmatch(r"\d+\.\d+\.\d+", ver): bad.append(f"non-stable version {ver}")
          if bad: sys.exit("LOCK GUARD FAILED for tag1/scolta-php: "+"; ".join(bad))
          print(f"Lock guard OK: tag1/scolta-php {ver} via {dist}")
          PY

  dist-build:
    name: Distribution archive build + validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl
          coverage: none

      - name: Install dependencies (no dev)
        run: composer install --no-dev --prefer-dist --no-interaction

      - name: Build distribution archive
        run: |
          VERSION=$(bash scripts/plugin-version.sh)
          bash scripts/build-dist.sh "$VERSION"

      - name: Validate distribution archive
        run: |
          VERSION=$(bash scripts/plugin-version.sh)
          bash scripts/validate-dist.sh "scolta-${VERSION}.zip"

  plugin-check:
    name: WordPress.org Plugin Check (built zip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl
          coverage: none

      - name: Install dependencies (no dev)
        run: composer install --no-dev --prefer-dist --no-interaction

      - name: Build and unpack distribution archive
        run: |
          VERSION=$(bash scripts/plugin-version.sh)
          bash scripts/build-dist.sh "$VERSION"
          mkdir -p plugin-check-build
          unzip -q "scolta-${VERSION}.zip" -d plugin-check-build

      # Run WP.org's own Plugin Check against the exact artifact reviewers
      # would receive — not the repo checkout. Errors AND warnings fail the
      # job: a warning-grade issue must not ride into a review round.
      #
      # The official wordpress/plugin-check-action is currently broken on the
      # ubuntu-24.04 runner image: it puts the plugin-check zip in
      # .wp-env.json as a URL plugin, and wp-env's URL download path silently
      # exits 0 without starting on Node 24.16
      # (https://github.com/WordPress/plugin-check-action/issues/579). Its
      # steps are inlined here with the maintainer-recommended workaround:
      # no URL plugins in .wp-env.json, install plugin-check via wp-cli after
      # boot, and verify the environment actually came up.
      - name: Setup wp-env
        run: |
          cat > .wp-env.json <<'EOF'
          {
            "core": null,
            "plugins": [],
            "mappings": { "wp-content/plugins/scolta": "./plugin-check-build/scolta" }
          }
          EOF
          npm -g --no-fund i @wordpress/env

      - name: Start wp-env (verified)
        run: |
          wp-env start
          # wp-env can exit 0 without starting Docker; convert that silent
          # failure into a loud one before trusting the environment.
          wp-env run cli wp cli info

      - name: Run Plugin Check
        run: |
          wp-env run cli wp plugin install plugin-check --activate
          wp-env run cli wp plugin activate scolta
          # --slug: the wp.org slug (matches the Text Domain); without it the
          # check infers the slug from the directory name and flags every
          # i18n call. Exit code is non-zero when errors OR warnings are
          # found — warnings are fatal on purpose. If a future warning is a
          # confirmed false positive, suppress that one check with plugin
          # check's --exclude-checks flag in an explicit, justified commit;
          # never re-add --ignore-warnings.
          wp-env run cli wp plugin check scolta \
            --slug=scolta-ai-search \
            --require=./wp-content/plugins/plugin-check/cli.php

  antipatterns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for known bad patterns
        run: |
          FAIL=0

          # Unbounded WP_Query (can exhaust memory on large sites). The key is
          # always quoted in WP array syntax, so the pattern must match
          # 'posts_per_page' => -1 — a bare-key-only regex never fires.
          if grep -rnE "[\"']?posts_per_page[\"']?[[:space:]]*=>[[:space:]]*-1" includes/ admin/ cli/ 2>/dev/null; then
            echo "FAIL: Unbounded WP_Query (posts_per_page => -1) found"
            FAIL=1
          fi

          # IndexBuildOrchestrator constructed without a logger or progress reporter
          if grep -rn 'new IndexBuildOrchestrator' includes/ 2>/dev/null | grep -qvE 'logger|progress'; then
            echo "FAIL: IndexBuildOrchestrator constructed without logger/progress in includes/"
            grep -rn 'new IndexBuildOrchestrator' includes/ | grep -vE 'logger|progress'
            FAIL=1
          fi

          [ $FAIL -eq 0 ] && echo "PASS: No known bad patterns found."
          exit $FAIL
